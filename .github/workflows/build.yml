# Gera os instaladores do Raccoon IA: Windows (.exe), macOS (.dmg) e Android (.apk).
# Rode manualmente em Actions → "Build apps" → Run workflow, ou crie uma tag v*.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: --win nsis zip
          - os: macos-latest
            target: --mac dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: raccoon-ia-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # o runner do GitHub já vem com o Android SDK instalado
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: raccoon-ia-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
