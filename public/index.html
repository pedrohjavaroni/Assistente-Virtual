<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Raccoon IA</title>
  <meta name="description" content="Seu guaxinim virtual com inteligência artificial" />
  <meta name="theme-color" content="#0d0e17" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="raccoon.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><span class="logo">R</span><span>RACCOON<em>IA</em></span></div>
      <div class="level" id="level">Nv. 1</div>
      <button class="icon-btn companion-btn" id="companionBtn" title="Guaxinim na tela"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4M14 13l2-2 2 2"/></svg></button>
      <button class="icon-btn" id="langBtn" title="Idioma / Language">PT</button>
      <button class="icon-btn" id="tasksBtn" title="Tarefas"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span class="badge" id="taskBadge" hidden>0</span></button>
    </header>

    <section class="stage" id="stage">
      <div class="bubble" id="bubble" hidden></div>
      <div class="pet mood-happy" id="pet" title="Clique para interagir">
                <div class="fx" id="fx"></div>
      </div>
    </section>

    <section class="stats" id="stats">
      <div class="stat"><span><b data-i18n="hunger">Fome</b></span><div class="bar"><i id="bar-hunger"></i></div></div>
      <div class="stat"><span><b data-i18n="energy">Energia</b></span><div class="bar"><i id="bar-energy"></i></div></div>
      <div class="stat"><span><b data-i18n="fun">Diversão</b></span><div class="bar"><i id="bar-fun"></i></div></div>
      <div class="stat"><span><b data-i18n="hygiene">Higiene</b></span><div class="bar"><i id="bar-hygiene"></i></div></div>
    </section>

    <nav class="care">
      <button data-care="feed"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"/></svg><span data-i18n="feed">Alimentar</span></button>
      <button data-care="play"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15 12h.01M18 13.5h.01"/></svg><span data-i18n="play">Brincar</span></button>
      <button data-care="sleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span data-i18n="sleep">Dormir</span></button>
      <button data-care="clean"><svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg><span data-i18n="clean">Limpar</span></button>
    </nav>

    <section class="chat" id="chat" aria-live="polite"></section>

    <form class="composer" id="composer">
      <button type="button" class="mic" id="micBtn" title="Falar"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></button>
      <input id="input" autocomplete="off" placeholder="Pergunte algo ao Raccoon..." />
      <button type="submit" class="send" title="Enviar"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button>
    </form>
    <div class="voice-row">
      <label><input type="checkbox" id="speakToggle" checked /> <span data-i18n="speak">Falar respostas</span></label>
      <label><input type="checkbox" id="wakeToggle" /> <span data-i18n="wake">Modo "Ei Raccoon"</span></label>
    </div>
  </div>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <h2 data-i18n="tasks">Tarefas</h2>
      <button class="icon-btn" id="closeDrawer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <form id="taskForm" class="task-form">
      <input id="taskInput" placeholder="Nova tarefa..." autocomplete="off" />
      <button><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
    <ul id="taskList" class="task-list"></ul>
    <h3 data-i18n="reminders">Lembretes</h3>
    <ul id="reminderList" class="task-list"></ul>
    <div id="settings" hidden>
      <h3 data-i18n="apiKey">Chave da API do Claude</h3>
      <form id="keyForm" class="task-form">
        <input id="keyInput" type="password" placeholder="sk-ant-..." autocomplete="off" />
        <button><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button>
      </form>
    </div>
    <p class="hint" data-i18n="hint">Dica: diga "me lembre de beber água às 15h" ou "adicione comprar pão".</p>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
