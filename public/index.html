<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Raccoon IA</title>
  <meta name="description" content="Seu guaxinim virtual com inteligência artificial" />
  <meta name="theme-color" content="#2b2d42" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">🦝 <span>Raccoon IA</span></div>
      <div class="level" id="level">Nv. 1</div>
      <button class="icon-btn" id="langBtn" title="Idioma / Language">PT</button>
      <button class="icon-btn" id="tasksBtn" title="Tarefas">📝<span class="badge" id="taskBadge" hidden>0</span></button>
    </header>

    <section class="stage" id="stage">
      <div class="bubble" id="bubble" hidden></div>
      <div class="pet mood-happy" id="pet" title="Faça carinho!">
        <svg viewBox="0 0 240 240" aria-label="Guaxinim" role="img">
          <!-- cauda listrada -->
          <g id="tail">
            <path d="M150 190 C 205 185, 230 140, 210 95 C 200 120, 185 150, 150 165 Z" fill="#7d8597"/>
            <path d="M196 116 C 204 126, 206 134, 205 140 L 190 150 C 192 140, 190 130, 184 122 Z" fill="#33333d"/>
            <path d="M182 150 C 186 158, 186 165, 184 170 L 168 176 C 171 168, 171 160, 168 154 Z" fill="#33333d"/>
            <path d="M210 95 C 216 105, 214 112, 208 118 C 204 110, 204 102, 210 95 Z" fill="#33333d"/>
          </g>
          <!-- corpo -->
          <ellipse cx="118" cy="178" rx="52" ry="44" fill="#8d99ae"/>
          <ellipse cx="118" cy="188" rx="32" ry="28" fill="#dfe3ea"/>
          <!-- patinhas -->
          <ellipse cx="92" cy="218" rx="15" ry="9" fill="#33333d"/>
          <ellipse cx="144" cy="218" rx="15" ry="9" fill="#33333d"/>
          <g id="arms">
            <ellipse class="arm-l" cx="76" cy="182" rx="11" ry="18" fill="#7d8597"/>
            <ellipse class="arm-r" cx="160" cy="182" rx="11" ry="18" fill="#7d8597"/>
          </g>
          <!-- cabeça -->
          <g id="head">
            <path d="M52 62 L 66 20 L 96 48 Z" fill="#7d8597"/>
            <path d="M62 54 L 69 32 L 86 48 Z" fill="#33333d"/>
            <path d="M184 62 L 170 20 L 140 48 Z" fill="#7d8597"/>
            <path d="M174 54 L 167 32 L 150 48 Z" fill="#33333d"/>
            <ellipse cx="118" cy="92" rx="72" ry="58" fill="#8d99ae"/>
            <path d="M118 52 C 112 60, 112 72, 118 80 C 124 72, 124 60, 118 52 Z" fill="#33333d" opacity=".6"/>
            <!-- máscara -->
            <path d="M48 92 C 60 70, 100 72, 112 92 C 104 112, 64 116, 48 92 Z" fill="#2b2d42"/>
            <path d="M188 92 C 176 70, 136 72, 124 92 C 132 112, 172 116, 188 92 Z" fill="#2b2d42"/>
            <!-- focinho -->
            <ellipse cx="118" cy="118" rx="34" ry="24" fill="#edf0f4"/>
            <ellipse cx="118" cy="106" rx="10" ry="7" fill="#22222a"/>
            <!-- olhos -->
            <g id="eyes">
              <g class="eye"><circle cx="82" cy="92" r="11" fill="#fff"/><circle class="pupil" cx="84" cy="93" r="6.5" fill="#111"/><circle cx="86" cy="90" r="2.2" fill="#fff"/></g>
              <g class="eye"><circle cx="154" cy="92" r="11" fill="#fff"/><circle class="pupil" cx="152" cy="93" r="6.5" fill="#111"/><circle cx="154" cy="90" r="2.2" fill="#fff"/></g>
            </g>
            <g id="eyesClosed">
              <path d="M72 94 Q 82 100 92 94" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
              <path d="M144 94 Q 154 100 164 94" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            </g>
            <g id="eyesHappy">
              <path d="M72 96 Q 82 84 92 96" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
              <path d="M144 96 Q 154 84 164 96" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            </g>
            <g id="eyesLove">
              <path d="M82 100 l-9 -9 a5 5 0 0 1 9 -5 a5 5 0 0 1 9 5 z" fill="#ef476f"/>
              <path d="M154 100 l-9 -9 a5 5 0 0 1 9 -5 a5 5 0 0 1 9 5 z" fill="#ef476f"/>
            </g>
            <!-- bochechas -->
            <g id="blush">
              <ellipse cx="80" cy="124" rx="9" ry="5" fill="#ff8fab" opacity=".7"/>
              <ellipse cx="156" cy="124" rx="9" ry="5" fill="#ff8fab" opacity=".7"/>
            </g>
            <!-- bocas -->
            <path id="mouthSmile" d="M106 120 Q 112 128 118 120 Q 124 128 130 120" stroke="#22222a" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path id="mouthSad" d="M106 128 Q 118 118 130 128" stroke="#22222a" stroke-width="3" fill="none" stroke-linecap="round"/>
            <ellipse id="mouthOpen" cx="118" cy="125" rx="8" ry="7" fill="#7a1f2b"/>
            <circle id="mouthThink" cx="126" cy="124" r="3.5" fill="#22222a"/>
          </g>
          <!-- extras -->
          <g id="zzz" fill="#fff" font-family="sans-serif" font-weight="700">
            <text x="182" y="50" font-size="18">z</text><text x="196" y="34" font-size="22">Z</text>
          </g>
          <g id="dirt" fill="#6b4f3a" opacity=".55">
            <circle cx="94" cy="160" r="6"/><circle cx="140" cy="196" r="5"/><circle cx="150" cy="72" r="4"/><circle cx="70" cy="190" r="4"/>
          </g>
        </svg>
        <div class="fx" id="fx"></div>
      </div>
    </section>

    <section class="stats" id="stats">
      <div class="stat"><span>🍎 <b data-i18n="hunger">Fome</b></span><div class="bar"><i id="bar-hunger"></i></div></div>
      <div class="stat"><span>⚡ <b data-i18n="energy">Energia</b></span><div class="bar"><i id="bar-energy"></i></div></div>
      <div class="stat"><span>🎾 <b data-i18n="fun">Diversão</b></span><div class="bar"><i id="bar-fun"></i></div></div>
      <div class="stat"><span>🫧 <b data-i18n="hygiene">Higiene</b></span><div class="bar"><i id="bar-hygiene"></i></div></div>
    </section>

    <nav class="care">
      <button data-care="feed">🍎<span data-i18n="feed">Alimentar</span></button>
      <button data-care="play">🎾<span data-i18n="play">Brincar</span></button>
      <button data-care="sleep">😴<span data-i18n="sleep">Dormir</span></button>
      <button data-care="clean">🛁<span data-i18n="clean">Limpar</span></button>
    </nav>

    <section class="chat" id="chat" aria-live="polite"></section>

    <form class="composer" id="composer">
      <button type="button" class="mic" id="micBtn" title="Falar">🎤</button>
      <input id="input" autocomplete="off" placeholder="Pergunte algo ao Raccoon..." />
      <button type="submit" class="send" title="Enviar">➤</button>
    </form>
    <div class="voice-row">
      <label><input type="checkbox" id="speakToggle" checked /> <span data-i18n="speak">Falar respostas</span></label>
      <label><input type="checkbox" id="wakeToggle" /> <span data-i18n="wake">Modo "Ei Raccoon"</span></label>
    </div>
  </div>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <h2 data-i18n="tasks">Tarefas</h2>
      <button class="icon-btn" id="closeDrawer">✕</button>
    </div>
    <form id="taskForm" class="task-form">
      <input id="taskInput" placeholder="Nova tarefa..." autocomplete="off" />
      <button>+</button>
    </form>
    <ul id="taskList" class="task-list"></ul>
    <h3 data-i18n="reminders">Lembretes</h3>
    <ul id="reminderList" class="task-list"></ul>
    <p class="hint" data-i18n="hint">Dica: diga "me lembre de beber água às 15h" ou "adicione comprar pão".</p>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
