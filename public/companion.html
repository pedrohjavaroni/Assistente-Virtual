<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Argos</title>
  <link rel="stylesheet" href="orb.css" />
  <style>
    :root { color-scheme: dark; --cyan: #4fd8ff; --line: rgba(120,190,255,.25); }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: #dbe7f5; user-select: none; }
    .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 6px; }
    .bubble {
      max-width: calc(100% - 16px); margin: 0 8px 8px; padding: 8px 11px; border-radius: 12px;
      background: rgba(6,10,18,.94); border: 1px solid var(--line); border-left: 3px solid var(--cyan);
      box-shadow: 0 8px 24px rgba(0,0,0,.5); max-height: 130px; overflow: auto;
      opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none;
    }
    .bubble.show { opacity: 1; transform: none; pointer-events: auto; }
    .ask { display: none; margin: 0 8px 8px; width: calc(100% - 16px); }
    .ask.show { display: block; }
    .ask input { width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--cyan); background: rgba(6,10,18,.96); color: #fff; padding: 7px 9px; font: inherit; outline: none; }
    .zone { position: relative; padding: 0 30px; }
    #orb { width: 96px; cursor: grab; touch-action: none; border-radius: 50%; background: radial-gradient(circle, rgba(6,10,18,.75) 55%, transparent 72%); }
    #orb:active { cursor: grabbing; }
    .tools { position: absolute; top: 18px; right: 0; display: flex; flex-direction: column; gap: 5px; opacity: 0; transition: opacity .15s; pointer-events: none; }
    .zone:hover .tools { opacity: 1; pointer-events: auto; }
    .tools button { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: rgba(6,10,18,.92); color: var(--cyan); display: grid; place-items: center; cursor: pointer; padding: 0; }
    .tools svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bubble" id="bubble"></div>
    <form class="ask" id="ask"><input id="askInput" placeholder="Pergunte algo…" autocomplete="off" /></form>
    <div class="zone" id="zone">
      <div id="orb" title="Clique para falar · duplo clique abre o Argos"></div>
      <div class="tools">
        <button id="chat" title="Digitar um pedido"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.600A8 8 0 1 1 21 12z"/></svg></button>
        <button id="open" title="Abrir o Argos"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></button>
      </div>
    </div>
  </div>
  <script type="module" src="companion.js"></script>
</body>
</html>
