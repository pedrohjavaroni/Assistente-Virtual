<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Raccoon</title>
  <link rel="stylesheet" href="raccoon.css" />
  <style>
    :root { color-scheme: dark; --cyan: #3ef0d0; --pink: #ff5d8f; --line: rgba(255,255,255,.12); }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font: 13px/1.4 "Inter", "Segoe UI", system-ui, sans-serif; color: #e9ecf5; user-select: none; }
    .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
    .bubble {
      max-width: calc(100% - 16px); margin: 0 8px 6px; padding: 8px 11px; border-radius: 12px;
      background: rgba(13,14,23,.92); border: 1px solid var(--line); border-left: 3px solid var(--cyan);
      box-shadow: 0 8px 24px rgba(0,0,0,.4); max-height: 120px; overflow: auto;
      opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; pointer-events: none;
    }
    .bubble.show { opacity: 1; transform: none; pointer-events: auto; }
    .ask { display: none; gap: 6px; margin: 0 8px 6px; width: calc(100% - 16px); }
    .ask.show { display: flex; }
    .ask input { flex: 1; min-width: 0; border-radius: 10px; border: 1px solid var(--cyan); background: rgba(13,14,23,.95); color: #fff; padding: 7px 9px; font: inherit; outline: none; }
    .pet { width: 150px; position: relative; cursor: grab; touch-action: none; }
    .pet:active { cursor: grabbing; }
    .tools {
      position: absolute; top: 34%; right: -6px; display: flex; flex-direction: column; gap: 5px;
      opacity: 0; transition: opacity .15s; pointer-events: none;
    }
    .pet-zone:hover .tools, .tools.show { opacity: 1; pointer-events: auto; }
    .tools button {
      width: 28px; height: 28px; border-radius: 9px; border: 1px solid var(--line); background: rgba(13,14,23,.9);
      color: var(--cyan); display: grid; place-items: center; cursor: pointer; padding: 0;
    }
    .tools button.on { background: var(--pink); color: #fff; }
    .tools svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .pet-zone { position: relative; padding: 0 22px 2px 0; }
    .facing-left .rc { transform: scaleX(-1); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bubble" id="bubble"></div>
    <form class="ask" id="ask"><input id="askInput" placeholder="Pergunte..." autocomplete="off" /></form>
    <div class="pet-zone" id="zone">
      <div class="pet mood-happy" id="pet"></div>
      <div class="tools" id="tools">
        <button id="mic" title="Falar"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg></button>
        <button id="chat" title="Perguntar"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
        <button id="feed" title="Comer"><svg viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"/></svg></button>
        <button id="open" title="Abrir app"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></button>
      </div>
    </div>
  </div>
  <script type="module" src="companion.js"></script>
</body>
</html>
